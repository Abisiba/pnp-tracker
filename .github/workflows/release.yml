# Faz 3 / İş 16 — a tagged release. The tag decides: only `v<project.version>`
# may publish, and the version lives in app/build.gradle.kts alone. Nothing is
# built until the whole test suite has passed, nothing is published until the
# Linux archive, the Arch package and the Windows installer have been built and
# checked, and the packages are unsigned — there is no signing key, so one
# SHA256SUMS covering all three is what a download is verified against.
#
# Running this by hand (workflow_dispatch) verifies the release path without
# publishing anything: the publish job only runs for a pushed tag.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tag and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-xdg/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg/config
      XDG_STATE_HOME: ${{ github.workspace }}/.ci-xdg/state
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-xdg/cache
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper'ını doğrula
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Etiket sürümle aynı mı
        # Before anything is built: a tag that is not v<project.version> stops
        # the run here, so no package and no release can come from it.
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          ./gradlew :app:checkReleaseTag -PreleaseTag="${GITHUB_REF_NAME}" \
            --no-daemon --no-parallel --max-workers=1

      - name: Elle çalıştırma yayın yapmaz
        if: ${{ github.event_name != 'push' }}
        run: echo "Bu koşu yalnız doğrulama içindir; yayın yalnız v<sürüm> etiketiyle yapılır."

      - name: Ekran sunucusu
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb

      - name: clean check
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          xvfb-run -a ./gradlew clean check --rerun-tasks \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Test raporları
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  package:
    name: packages
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    # The Arch package is built with makepkg, which only exists on Arch, so the
    # official Ubuntu runner runs an Arch container for this job. The same
    # Gradle tasks a person runs at home make both packages; there is no second
    # build pipeline here.
    container:
      image: archlinux:base-devel
      options: --user root
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
      # The container has no GPU and Xvfb offers no usable GL context, so Skia
      # draws in software. Without this the application starts anyway but prints
      # a RenderException, and the package check refuses a run that printed one.
      SKIKO_RENDER_API: SOFTWARE
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-xdg/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg/config
      XDG_STATE_HOME: ${{ github.workspace }}/.ci-xdg/state
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-xdg/cache
    steps:
      - name: Arch araçları
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git jdk21-openjdk libarchive zstd \
            xorg-server-xvfb xorg-xdpyinfo xorg-xprop wmctrl openbox \
            desktop-file-utils ttf-dejavu \
            glibc libstdc++ libglvnd libx11 libxext libxi libxrender libxtst fontconfig
          # The dependency check asks which package provides a library, and the
          # answer must not depend on what this container happens to install.
          pacman -Fy --noconfirm

      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Yetkisiz derleme kullanıcısı
        # makepkg refuses to run as root, and nothing here needs root.
        run: |
          set -euo pipefail
          useradd --create-home builder
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Sanal ekran ve pencere yöneticisi
        # The package checks open the real window and close it with
        # SafeWindowCloser, which asks wmctrl for the window list. wmctrl reads
        # _NET_CLIENT_LIST, and only a window manager sets it — a bare Xvfb is
        # not enough, so openbox runs on the same display.
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp -ac &
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 >/dev/null
          runuser -u builder -- env DISPLAY=:99 HOME=/home/builder openbox --sm-disable &
          for _ in $(seq 1 30); do DISPLAY=:99 wmctrl -m >/dev/null 2>&1 && break; sleep 1; done
          DISPLAY=:99 wmctrl -m

      - name: Paketleri üret ve doğrula
        run: |
          set -euo pipefail
          runuser -u builder -- env \
            DISPLAY=:99 SKIKO_RENDER_API="$SKIKO_RENDER_API" \
            JAVA_HOME="$JAVA_HOME" \
            XDG_DATA_HOME="$XDG_DATA_HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
            XDG_STATE_HOME="$XDG_STATE_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            ./gradlew :app:verifyLinuxPackage :app:verifyArchPackage :app:packageRelease \
              --no-daemon --no-parallel --max-workers=1 \
              -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Özetler kendi dosyalarına uyuyor
        run: |
          set -euo pipefail
          cd app/build/release
          sha256sum -c SHA256SUMS
          ls -l

      - name: Yayın dosyaları
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: app/build/release/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: windows installer
    needs: verify
    # The installer can only be made on Windows, so GitHub's Windows runner makes
    # it — the same task the CI Windows job runs, with the Java runtime inside
    # one .exe. The tests already passed in `verify`; this job builds and checks
    # the installer and proves no real user folder was touched on the way.
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper'ını doğrula
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Kurucuyu üret ve doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat :app:verifyWindowsPackage `
            --no-daemon --no-parallel --max-workers=1 `
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'
          $installers = @(Get-ChildItem app\build\windows\dist -Filter *.exe)
          if ($installers.Count -ne 1) { throw "expected exactly one installer, found $($installers.Count)" }
          Get-FileHash -Algorithm SHA256 $installers[0].FullName | Format-List

      - name: Kurucuyu üreten aracın sürümü
        # The WiX jpackage really used is the one the Compose plugin fetched
        # during the build (PLAN 14.8.6); its version is recorded, not assumed.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-ChildItem -Path build, app\build, $env:GRADLE_USER_HOME -Recurse -Filter candle.exe -ErrorAction SilentlyContinue
          if (-not $found) { throw "the tool that built the installer was not found, so its version cannot be recorded" }
          foreach ($candle in $found) {
            Write-Output $candle.FullName
            & $candle.FullName -? | Select-Object -First 1
          }

      - name: Uygulama gerçek bir kullanıcı dizini açmadı
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @("$env:LOCALAPPDATA\pnp-tracker", "$env:APPDATA\pnp-tracker")) {
            if (Test-Path $path) { throw "$path was created by the run" }
          }

      - name: Kurucu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-installer
          path: app/build/windows/dist/*.exe
          retention-days: 7
          if-no-files-found: error

  publish:
    name: github release
    needs:
      - package
      - windows
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only place in this repository that may write, and it may write nothing
    # but releases.
    permissions:
      contents: write
    steps:
      - name: Yayın dosyalarını al
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release

      - name: Windows kurucusunu al
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-installer
          path: windows

      - name: Kurucuyu yayına ve özetlere ekle
        # One checksum file for the whole release: the installer's line is added
        # to the one the Linux job wrote, and the file is checked end to end below.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          installer="pnp-tracker-${version}-windows-x86_64.exe"
          test "$(find windows -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test -f "windows/$installer"
          cp "windows/$installer" release/
          cd release
          sha256sum "$installer" >> SHA256SUMS
          LC_ALL=C sort -k 2 -o SHA256SUMS SHA256SUMS

      - name: Özetleri yeniden doğrula
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS

      - name: Bu etiketin yayını zaten var mı
        # A second run for the same tag stops here instead of overwriting a
        # release people may already have downloaded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME için yayın zaten var; üzerine yazılmıyor." >&2
            echo "Yeniden yayımlamak gerekiyorsa mevcut yayını elle kaldırın." >&2
            exit 1
          fi

      - name: Yayın notları
        # Written here from the checksum file alone: no build log, no path of
        # the runner, no user content. In English, for whoever finds the page.
        run: |
          set -euo pipefail
          {
            printf '## PnP Production Tracker %s\n\n' "$GITHUB_REF_NAME"
            printf 'An offline desktop application for tracking print-and-play board game production.\n'
            printf 'Its interface is in Turkish. No package needs Java to be installed: the runtime is inside.\n\n'
            printf '| File | For |\n| --- | --- |\n'
            printf '| `%s` | 64-bit Windows; run it to install. Built and checked on GitHub'"'"'s Windows runner, **not yet tried by hand on a real Windows 11 installation**. |\n' \
              "$(awk '/\.exe$/ {print $2}' release/SHA256SUMS)"
            printf '| `%s` | any Linux distribution, x86_64; unpack and run `bin/pnp-tracker` |\n' \
              "$(awk '/\.tar\.gz$/ {print $2}' release/SHA256SUMS)"
            printf '| `%s` | Garuda and Arch; `pacman -U` |\n\n' \
              "$(awk '/\.pkg\.tar\.zst$/ {print $2}' release/SHA256SUMS)"
            printf 'The *Source code* archives GitHub adds below are the repository'"'"'s source, not an installer.\n\n'
            printf 'The packages are **unsigned**, so Windows SmartScreen may warn about an unknown publisher.\n'
            printf 'Verify what you downloaded before running it:\n\n'
            printf '```bash\nsha256sum -c SHA256SUMS --ignore-missing\n```\n\n'
            printf 'On Windows: `Get-FileHash -Algorithm SHA256 <file>` and compare with the line below.\n\n'
            printf '```text\n'
            cat release/SHA256SUMS
            printf '```\n\n'
            printf 'Installing, using and importing: `kullanim-kilavuzu.md` (user guide) and `ornek-ice-aktarma.md` (import guide).\n'
            printf 'Licence: MIT (`LICENSE`). The bundled runtime and libraries come with their own\n'
            printf 'licences (`THIRD_PARTY_NOTICES.md`).\n'
          } > notes.md
          cat notes.md

      - name: Yayını oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PnP Production Tracker $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            release/*
