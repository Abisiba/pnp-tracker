# Faz 3 / İş 16 — every pull request and every push to main is verified here
# with the same command a person runs at home (README, "Kaynaktan doğrulama").
# The job may only read this repository, it never sees a secret, and it runs
# against temporary XDG folders: no test may reach a real user's database.
name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; no job here asks for more.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # The application's own folders, inside the workspace and thrown away with
      # the runner. Nothing the tests write can land in a real home directory.
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-xdg/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg/config
      XDG_STATE_HOME: ${{ github.workspace }}/.ci-xdg/state
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-xdg/cache
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper'ını doğrula
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Only a build of main may write the shared cache; a pull request —
          # including one from a fork — reads it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure

      - name: Geçici XDG dizinleri
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          printf 'XDG: %s\n' "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"
          test ! -e "$XDG_DATA_HOME/pnp-tracker"

      - name: Ekran sunucusu
        # One test asks AWT's toolkit for the system event queue, so the suite
        # needs a display. It is given one instead of being skipped.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb

      - name: clean check
        # The memory-limited form the project uses: no daemon, no parallelism,
        # one worker, compilation in the Gradle process.
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew clean check --rerun-tasks \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Test raporları
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Şema, fixture ve kaynaklar değişmedi
        # A test run may not rewrite what it reads: the exported Room schemas,
        # the import fixtures, PLAN.md, or any other tracked file.
        run: |
          set -euo pipefail
          git diff --exit-code -- app/schemas app/src/desktopTest/resources PLAN.md
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal -- app/schemas)"

      - name: Uygulama gerçek bir veri dizini açmadı
        run: |
          set -euo pipefail
          test ! -e "$HOME/.local/share/pnp-tracker"
          test ! -e "$HOME/.config/pnp-tracker"
          test ! -e "$HOME/.local/state/pnp-tracker"

  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper'ını doğrula
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure

      - name: clean check
        # The same memory-limited form the Linux job uses. Windows runners have an
        # interactive desktop session, so the tests that open a Compose scene need
        # no display server of their own.
        #
        # Every argument that begins with a dash and carries a dot is quoted:
        # PowerShell ends a parameter name at the first dot, so an unquoted
        # -Pkotlin.compiler.execution.strategy=in-process reaches Gradle split in
        # two and its tail is read as a task name.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat clean check --rerun-tasks `
            --no-daemon --no-parallel --max-workers=1 `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'

      - name: Kurucuyu üret ve doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat :app:verifyWindowsPackage `
            --no-daemon --no-parallel --max-workers=1 `
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'
          Get-ChildItem app\build\windows\dist | Select-Object Name, Length
          Get-FileHash -Algorithm SHA256 app\build\windows\dist\*.exe | Format-List

      - name: Kurucuyu üreten aracın sürümü
        # jpackage builds a Windows installer with WiX, and the WiX it uses is the
        # one the Compose plugin fetches for itself during the build — pinned by
        # that plugin's version, not by anything this workflow installs. So the
        # tool that really made the installer is the one audited here, after the
        # fact, rather than a version this file claims and jpackage never sees
        # (PLAN 14.8.6).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-ChildItem -Path build, app\build, $env:GRADLE_USER_HOME -Recurse -Filter candle.exe -ErrorAction SilentlyContinue
          if (-not $found) { throw "the tool that built the installer was not found, so its version cannot be recorded" }
          foreach ($candle in $found) {
            Write-Output $candle.FullName
            & $candle.FullName -? | Select-Object -First 1
          }

      - name: Kurucu
        # The installer is published on the pull request so a real Windows 11
        # machine can download it and be tried by hand before anything is merged.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: app/build/windows/dist/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Test raporları
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Şema, fixture ve kaynaklar değişmedi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code -- app/schemas app/src/desktopTest/resources PLAN.md
          git diff --exit-code

      - name: Uygulama gerçek bir kullanıcı dizini açmadı
        # The Windows counterpart of the Linux job's last step: no test may reach
        # the folders a real user's data would be in (PLAN 14.8.1).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @("$env:LOCALAPPDATA\pnp-tracker", "$env:APPDATA\pnp-tracker")) {
            if (Test-Path $path) { throw "$path was created by the run" }
          }
